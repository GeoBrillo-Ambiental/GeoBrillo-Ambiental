<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Centros de Acopio y Maquinaria</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-3xl mx-auto space-y-6">

        <a href="index.html" class="text-sm text-green-700 hover:underline">← Volver al inicio</a>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- ============== CENTRO DE ACOPIO / VERTEDERO ============== -->
            <div class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
                <h2 class="text-xl font-bold text-center text-green-700">
                    Registro de Centro 🏭
                </h2>

                <div id="mensajeExitoCentro" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded-lg text-center text-sm font-medium">
                    ¡Centro guardado con éxito!
                </div>
                <div id="mensajeErrorCentro" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg text-center text-sm font-medium"></div>

                <form id="formCentro" class="space-y-4">
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" name="nombre" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: Planta Felipe Cardoso">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Dirección</label>
                        <input type="text" name="direccion" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: Camino s/n">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Tipo</label>
                        <select name="tipo" required class="w-full border border-gray-300 rounded-lg p-3">
                            <option value="Vertedero">Vertedero</option>
                            <option value="Acopio">Acopio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Capacidad Total</label>
                        <input type="number" name="cap_total" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: 10000">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Capacidad Actual</label>
                        <input type="number" name="cap_actual" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: 6500">
                    </div>
                    <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                        Guardar Centro
                    </button>
                </form>
            </div>

            <!-- ============== MAQUINARIA BÁSICA ============== -->
            <div class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
                <h2 class="text-xl font-bold text-center text-green-700">
                    Registro de Maquinaria 🛠️
                </h2>

                <div id="mensajeExitoMaq" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded-lg text-center text-sm font-medium">
                    ¡Maquinaria guardada con éxito!
                </div>
                <div id="mensajeErrorMaq" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg text-center text-sm font-medium"></div>

                <form id="formMaquinaria" class="space-y-4">
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" name="nombre" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: Pala cargadora">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Tipo</label>
                        <input type="text" name="tipo" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: Pala mecánica">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Estado</label>
                        <select name="estado" required class="w-full border border-gray-300 rounded-lg p-3">
                            <option value="Operativa">Operativa</option>
                            <option value="En mantenimiento">En mantenimiento</option>
                            <option value="Fuera de servicio">Fuera de servicio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-medium text-gray-700">Id de Centro</label>
                        <input type="number" name="id_centro" required class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: 1">
                    </div>
                    <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                        Guardar Maquinaria
                    </button>
                </form>
            </div>

        </div>

        <a href="listarcentros.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-medium rounded-lg py-3 text-center transition">
            Ver Lista de Centros y Maquinaria
        </a>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', protegerVistaDeGestion);

        document.getElementById("formCentro").addEventListener("submit", function (e) {
            e.preventDefault();
            const datos = new FormData(this);
            datos.append("accion", "insertar");
            datos.append("token", getToken());

            const exito = document.getElementById("mensajeExitoCentro");
            const error = document.getElementById("mensajeErrorCentro");
            exito.classList.add("hidden");
            error.classList.add("hidden");

            fetch(`${API_GESTION}/centroapi.php`, { method: "POST", body: datos })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        this.reset();
                        exito.classList.remove("hidden");
                        setTimeout(() => exito.classList.add("hidden"), 3000);
                    } else {
                        error.textContent = data.mensaje;
                        error.classList.remove("hidden");
                    }
                })
                .catch(err => {
                    error.textContent = "Error al guardar el centro: " + err.message;
                    error.classList.remove("hidden");
                });
        });

        document.getElementById("formMaquinaria").addEventListener("submit", function (e) {
            e.preventDefault();
            const datos = new FormData(this);
            datos.append("accion", "insertar");
            datos.append("token", getToken());

            const exito = document.getElementById("mensajeExitoMaq");
            const error = document.getElementById("mensajeErrorMaq");
            exito.classList.add("hidden");
            error.classList.add("hidden");

            fetch(`${API_GESTION}/maquinariaapi.php`, { method: "POST", body: datos })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        this.reset();
                        exito.classList.remove("hidden");
                        setTimeout(() => exito.classList.add("hidden"), 3000);
                    } else {
                        error.textContent = data.mensaje;
                        error.classList.remove("hidden");
                    }
                })
                .catch(err => {
                    error.textContent = "Error al guardar la maquinaria: " + err.message;
                    error.classList.remove("hidden");
                });
        });
    </script>

</body>
</html>
