<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-4">

        <a href="index.html" class="text-sm text-green-700 hover:underline">← Volver al inicio</a>

        <div id="mensajeExito" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg text-center text-sm font-medium">
            ¡Usuario guardado con éxito! 👤
        </div>
        <div id="mensajeError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-center text-sm font-medium"></div>

        <form id="formUsuario" class="space-y-5">

            <h2 class="text-2xl sm:text-3xl font-bold text-center text-green-700">
                Registro de Usuarios 👤
            </h2>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Primer Nombre</label>
                <input type="text" name="pri_nom" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Nombre">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Primer Apellido</label>
                <input type="text" name="pri_ape" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Apellido">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Nombre de Usuario</label>
                <input type="text" name="nom_usuario" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Nombre de usuario">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Contraseña">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="correo@ejemplo.com">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Rol (Id_Rol)</label>
                <select name="id_rol" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="1">1 - Ciudadano</option>
                    <option value="2">2 - Chofer</option>
                    <option value="3">3 - Operador</option>
                    <option value="4">4 - Cuadrilla</option>
                    <option value="5">5 - Administrador</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">ID de Cuadrilla (opcional)</label>
                <input type="number" name="id_cuadrilla" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Dejar vacío si no aplica">
            </div>

            <div class="space-y-3 pt-2">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                    Guardar Usuario
                </button>

                <a href="listarusuarios.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-medium rounded-lg py-3 text-center transition">
                    Ver Lista de Usuarios
                </a>
            </div>

        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', protegerVistaDeGestion);

        document.getElementById("formUsuario").addEventListener("submit", function (e) {
            e.preventDefault();

            const datos = new FormData(this);
            datos.append("accion", "insertar");
            datos.append("token", getToken());

            const exito = document.getElementById("mensajeExito");
            const error = document.getElementById("mensajeError");
            exito.classList.add("hidden");
            error.classList.add("hidden");

            fetch(`${API_USUARIOS}/usuarioapi.php`, { method: "POST", body: datos })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        exito.classList.remove("hidden");
                        this.reset();
                        setTimeout(() => exito.classList.add("hidden"), 3000);
                    } else {
                        error.textContent = data.mensaje;
                        error.classList.remove("hidden");
                    }
                })
                .catch(err => {
                    error.textContent = "Error al registrar el usuario: " + err.message;
                    error.classList.remove("hidden");
                });
        });
    </script>

</body>
</html>
