<!DOCTYPE html>
<html lang="es" class="h-full bg-white">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeoBrillo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-full bg-white">

<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <img src="image/Logo_GeoBrillo_Ambiental.png" alt="GeoBrillo" class="mx-auto h-70 w-auto">
        <h2 class="mt-6 text-center text-3xl font-bold text-black">
            Iniciar sesión
        </h2>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">

        <div id="mensajeInfo" class="hidden mb-4 rounded-lg px-4 py-3 text-center text-sm font-medium"></div>

        <form id="formLogin" class="space-y-6">

            <div>
                <label for="email" class="block text-sm font-medium text-black">
                    Correo Electrónico
                </label>
                <div class="mt-2">
                    <input id="email" name="email" type="email" required autocomplete="email"
                        class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-black focus:border-green-600 focus:outline-none">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-black">
                    Contraseña
                </label>
                <div class="mt-2">
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                        class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-black focus:border-green-600 focus:outline-none">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="flex w-full justify-center rounded-md bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-700 transition">
                    Iniciar sesión
                </button>
            </div>

        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            ¿No tienes cuenta?
            <a href="registro.html" class="font-semibold text-green-700 hover:text-green-800">Regístrate aquí</a>
        </p>

    </div>

</div>

<script src="js/auth.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const cartel = document.getElementById("mensajeInfo");

    if (params.get("registrado") === "1") {
        cartel.textContent = "¡Cuenta creada con éxito! Ya puedes iniciar sesión.";
        cartel.className = "mb-4 rounded-lg px-4 py-3 text-center text-sm font-medium bg-green-100 border border-green-400 text-green-700";
        cartel.classList.remove("hidden");
    }

    document.getElementById("formLogin").addEventListener("submit", function (e) {
        e.preventDefault();

        const credenciales = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        fetch(`${API_USUARIOS}/login.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(credenciales)
        })
        .then(respuesta => respuesta.json())
        .then(resultado => {
            if (resultado.exito) {
                setToken(resultado.token);
                // Siempre volvemos al home: ahí el menú se arma solo
                // según el rol (ver renderizarNavSegunSesion en auth.js).
                window.location.href = "index.html";
            } else {
                cartel.textContent = resultado.mensaje;
                cartel.className = "mb-4 rounded-lg px-4 py-3 text-center text-sm font-medium bg-red-100 border border-red-400 text-red-700";
                cartel.classList.remove("hidden");
            }
        })
        .catch(error => {
            cartel.textContent = "Error al conectar con el servidor.";
            cartel.className = "mb-4 rounded-lg px-4 py-3 text-center text-sm font-medium bg-red-100 border border-red-400 text-red-700";
            cartel.classList.remove("hidden");
            console.error("Error en la petición:", error);
        });
    });
</script>

</body>
</html>
