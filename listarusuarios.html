<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-6 md:p-10">

    <div class="max-w-6xl mx-auto space-y-6">

        <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl sm:text-4xl font-bold text-green-700">
                Listado de Usuarios 👤
            </h1>
            <a href="usuarios.html" class="bg-green-700 hover:bg-green-800 text-white font-medium px-5 py-2.5 rounded-lg transition">
                + Agregar Usuario
            </a>
        </div>

        <div class="bg-white shadow-2xl rounded-2xl p-4 sm:p-8">

            <div class="overflow-x-auto">
                <table class="min-w-full border border-gray-300 text-sm sm:text-base">
                    <thead class="bg-green-700 text-white">
                        <tr>
                            <th class="px-4 py-3 border whitespace-nowrap">ID</th>
                            <th class="px-4 py-3 border whitespace-nowrap">Nombre</th>
                            <th class="px-4 py-3 border whitespace-nowrap">Email</th>
                            <th class="px-4 py-3 border whitespace-nowrap">Rol</th>
                        </tr>
                    </thead>

                    <tbody id="tablaUsuarios" class="text-center bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="4" class="py-4 text-gray-500">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let tabla = document.getElementById("tablaUsuarios");

            const datosLocales = JSON.parse(localStorage.getItem("usuarios_agregados")) || [];
            console.log("📦 Usuarios locales:", datosLocales);

            fetch("listarusuarios.php")
                .then(res => {
                    if (!res.ok) throw new Error("Error en la respuesta de listarusuarios.php");
                    return res.json();
                })
                .then(datosPHP => {
                    console.log("✅ Datos recibidos de PHP correctamente:", datosPHP);
                    const todosLosUsuarios = [...datosPHP, ...datosLocales];
                    mostrarTabla(todosLosUsuarios);
                })
                .catch(err => {
                    console.error("❌ Error al traer los datos de listarusuarios.php:", err);
                    if (datosLocales.length > 0) {
                        mostrarTabla(datosLocales);
                    } else {
                        tabla.innerHTML = `<tr><td colspan="4" class="py-4 text-gray-500">No hay usuarios registrados aún.</td></tr>`;
                    }
                });

            function mostrarTabla(usuarios) {
                tabla.innerHTML = "";

                if (!usuarios || usuarios.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="4" class="py-4 text-gray-500">No hay usuarios registrados.</td></tr>`;
                    return;
                }

                usuarios.forEach(usuario => {
                    tabla.innerHTML += `
                    <tr class="hover:bg-green-50">
                        <td class="border px-4 py-3">${usuario.Id_Usuario ?? '-'}</td>
                        <td class="border px-4 py-3">${usuario.Nom_Usuario ?? '-'}</td>
                        <td class="border px-4 py-3">${usuario.Email ?? '-'}</td>
                        <td class="border px-4 py-3">${usuario.Rol ?? '-'}</td>
                    </tr>
                    `;
                });
            }
        });
    </script>

</body>
</html>
