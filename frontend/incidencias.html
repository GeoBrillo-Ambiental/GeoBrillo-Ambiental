<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-lg mx-auto space-y-6">

        <a href="index.html" class="text-sm text-green-700 hover:underline">← Volver al inicio</a>

        <div class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
            <h2 class="text-xl font-bold text-center text-green-700">
                Reportar Incidencia ⚠️
            </h2>
            <p class="text-sm text-gray-500 text-center">
                Reportá un contenedor dañado, desbordado o con algún problema.
                Un equipo de gestión va a revisar tu reporte.
            </p>

            <div id="mensajeExito" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded-lg text-center text-sm font-medium">
                ¡Incidencia reportada con éxito! Gracias por avisarnos.
            </div>
            <div id="mensajeError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg text-center text-sm font-medium"></div>

            <form id="formIncidencia" class="space-y-4">
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Contenedor afectado</label>
                    <select name="id_contenedor" id="selectContenedor" required class="w-full border border-gray-300 rounded-lg p-3">
                        <option value="">Cargando contenedores...</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">¿Qué le pasa al contenedor?</label>
                    <select name="estado_reportado" required class="w-full border border-gray-300 rounded-lg p-3">
                        <option value="">Seleccioná una opción</option>
                        <option value="Desbordado">Desbordado</option>
                        <option value="Roto">Roto</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Descripción del problema</label>
                    <textarea name="descripcion" required rows="4" maxlength="120"
                              class="w-full border border-gray-300 rounded-lg p-3"
                              placeholder="Ej: Contenedor desbordado hace varios días"></textarea>
                </div>
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                    Reportar Incidencia
                </button>
            </form>
        </div>

        <a href="listarincidencias.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-medium rounded-lg py-3 text-center transition">
            Ver Incidencias Reportadas
        </a>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Cualquier usuario logueado (incluido Ciudadano) puede reportar.
        document.addEventListener('DOMContentLoaded', async () => {
            await protegerVistaConSesion();
            cargarContenedores();
        });

        function cargarContenedores() {
            fetch(`${API_GESTION}/contenedorapi.php?accion=listar&token=${encodeURIComponent(getToken())}`)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById("selectContenedor");
                    const contenedores = data.data || [];
                    if (contenedores.length === 0) {
                        select.innerHTML = `<option value="">No hay contenedores registrados</option>`;
                        return;
                    }
                    select.innerHTML = contenedores.map(c =>
                        `<option value="${c.Id_Contenedor}">Contenedor #${c.Id_Contenedor} — ${c.TipoReciduo ?? 'sin tipo'} (${c.EstadoCont ?? '-'})</option>`
                    ).join("");
                })
                .catch(err => {
                    document.getElementById("selectContenedor").innerHTML = `<option value="">Error al cargar contenedores</option>`;
                    console.error("❌ Error al traer contenedores:", err);
                });
        }

        document.getElementById("formIncidencia").addEventListener("submit", function (e) {
            e.preventDefault();
            const datos = new FormData(this);
            datos.append("accion", "reportar");
            datos.append("token", getToken());

            const exito = document.getElementById("mensajeExito");
            const error = document.getElementById("mensajeError");
            exito.classList.add("hidden");
            error.classList.add("hidden");

            fetch(`${API_GESTION}/incidenciaapi.php`, { method: "POST", body: datos })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        this.reset();
                        exito.classList.remove("hidden");
                        setTimeout(() => exito.classList.add("hidden"), 3000);
                    } else {
                        error.textContent = data.mensaje;
                        error.classList.remove("hidden");
                    }
                })
                .catch(err => {
                    error.textContent = "Error al reportar la incidencia: " + err.message;
                    error.classList.remove("hidden");
                });
        });
    </script>

</body>
</html>
