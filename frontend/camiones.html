<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Camiones</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-4">

        <a href="index.html" class="text-sm text-green-700 hover:underline">← Volver al inicio</a>

        <div id="mensajeExito" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg text-center text-sm font-medium">
            ¡Camión guardado con éxito! 🚚
        </div>
        <div id="mensajeError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-center text-sm font-medium"></div>

        <form id="formCamion" class="space-y-5">

            <h2 class="text-2xl sm:text-3xl font-bold text-center text-green-700">
                Registro de Camiones 🚚
            </h2>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Estado</label>
                <select name="estado" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="Disponible">Disponible</option>
                    <option value="En Reparación">En Reparación</option>
                    <option value="Fuera de Servicio">Fuera de Servicio</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Modelo</label>
                <select name="modelo" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="Frontal">Frontal</option>
                    <option value="Lateral">Lateral</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Capacidad de carga (C_Carga)</label>
                <input type="number" name="capacidad" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Ej: 10">
            </div>

            <div class="space-y-3 pt-2">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                    Guardar Camión
                </button>

                <a href="listarcamiones.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-medium rounded-lg py-3 text-center transition">
                    Ver Lista de Camiones
                </a>
            </div>

        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', protegerVistaDeGestion);

        document.getElementById("formCamion").addEventListener("submit", function (e) {
            e.preventDefault();

            const datos = new FormData(this);
            datos.append("accion", "insertar");
            datos.append("token", getToken());

            const exito = document.getElementById("mensajeExito");
            const error = document.getElementById("mensajeError");
            exito.classList.add("hidden");
            error.classList.add("hidden");

            fetch(`${API_GESTION}/camionapi.php`, { method: "POST", body: datos })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        this.reset();
                        exito.classList.remove("hidden");
                        setTimeout(() => exito.classList.add("hidden"), 3000);
                    } else {
                        error.textContent = data.mensaje;
                        error.classList.remove("hidden");
                    }
                })
                .catch(err => {
                    error.textContent = "Error al guardar el camión: " + err.message;
                    error.classList.remove("hidden");
                });
        });
    </script>

</body>
</html>
