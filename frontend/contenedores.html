<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Contenedores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="marca.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-4">

        <a href="index.html" class="js-volver text-sm text-green-700 hover:underline">← Volver</a>

        <div id="mensajeExito" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg text-center text-sm font-medium">
            ¡Contenedor guardado con éxito! ♻️
        </div>
        <div id="mensajeError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-center text-sm font-medium"></div>

        <form id="formContenedor" class="space-y-5">

            <h2 class="text-2xl sm:text-3xl font-bold text-center text-green-700">
                Registro de Contenedores ♻️
            </h2>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Estado</label>
                <select name="estado" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="Funcional">Funcional</option>
                    <option value="Roto">Roto</option>
                    <option value="Desbordado">Desbordado</option>
                    <option value="Repuesto">Repuesto (inventario)</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Tipo de Residuo</label>
                <select name="residuo" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="Reciclable">Reciclable</option>
                    <option value="Mezclados">Mezclados</option>
                    <option value="Orgánico">Orgánico</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Capacidad</label>
                <input type="number" name="capacidad" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Ej: 2">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Id de Ruta (opcional; se arma mejor desde Logística → Rutas)</label>
                <input type="number" name="id_ruta" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Ej: 1">
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Ubicación (opcional)</label>
                <input type="text" name="ubicacion"  maxlength="100" class="w-full border border-gray-300 rounded-lg p-3" placeholder="Ej: 18 de Julio y Ejido">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Latitud (opcional)</label>
                    <input type="number" step="any" name="latitud"  class="w-full border border-gray-300 rounded-lg p-3" placeholder="-34.9011">
                </div>
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Longitud (opcional)</label>
                    <input type="number" step="any" name="longitud"  class="w-full border border-gray-300 rounded-lg p-3" placeholder="-56.1645">
                </div>
            </div>
                <div>
                    <p class="text-xs text-gray-500 mb-1">📍 O hacé clic en el mapa para elegir la ubicación:</p>
                    <div id="selectorMapa" class="w-full rounded-lg border border-gray-300" style="height: 260px;"></div>
                </div>

            <p class="text-xs text-gray-500">Tip: en el mapa podés hacer clic para ver las coordenadas de cualquier punto.</p>

            <div class="space-y-3 pt-2">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                    Guardar Contenedor
                </button>

                <a href="listacontenedores.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-medium rounded-lg py-3 text-center transition">
                    Ver Lista de Contenedores
                </a>
            </div>

        </form>
    </div>

    <script src="js/auth.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/selector-mapa.js"></script>
    <script>
        const selectorMapa = montarSelectorMapa('selectorMapa', document.querySelector('[name="latitud"]'), document.querySelector('[name="longitud"]'));
        document.addEventListener('DOMContentLoaded', protegerVistaDeGestion);

        document.getElementById("formContenedor").addEventListener("submit", function (e) {
            e.preventDefault();

            const datos = new FormData(this);
            datos.append("accion", "insertar");
            datos.append("token", getToken());

            const exito = document.getElementById("mensajeExito");
            const error = document.getElementById("mensajeError");
            exito.classList.add("hidden");
            error.classList.add("hidden");

            fetch(`${API_GESTION}/contenedorapi.php`, { method: "POST", body: datos })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        this.reset();
                        exito.classList.remove("hidden");
                        setTimeout(() => exito.classList.add("hidden"), 3000);
                    } else {
                        error.textContent = data.mensaje;
                        error.classList.remove("hidden");
                    }
                })
                .catch(err => {
                    error.textContent = "Error al guardar el contenedor: " + err.message;
                    error.classList.remove("hidden");
                });
        });
    </script>

</body>
</html>
