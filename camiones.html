<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Camiones</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-4">
        
        <!-- Cartelito de éxito escondido por defecto -->
        <div id="mensajeExito" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg text-center text-sm font-medium">
            ¡Camión guardado con éxito! 🚚
        </div>

        <form id="formCamion" class="space-y-5">

            <h2 class="text-2xl sm:text-3xl font-bold text-center text-green-700">
                Registro de Camiones 🚚
            </h2>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Estado</label>
                <select id="estado" name="estado" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="Disponible">Disponible</option>
                    <option value="En Reparación">En Reparación</option>
                    <option value="Fuera de Servicio">Fuera de Servicio</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Modelo</label>
                <select id="modelo" name="modelo" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500">
                    <option value="Frontal">Frontal</option>
                    <option value="Lateral">Lateral</option>
                </select>
            </div>

            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Capacidad (toneladas)</label>
                <input type="number" id="capacidad" name="capacidad" required class="w-full border border-gray-300 rounded-lg p-3 focus:ring-green-500 focus:border-green-500" placeholder="Ej: 10">
            </div>

            <div class="space-y-3 pt-2">
                <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium rounded-lg py-3 transition">
                    Guardar Camión
                </button>

                <a href="listarcamiones.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-medium rounded-lg py-3 text-center transition">
                    Ver Lista de Camiones
                </a>
            </div>

        </form>
    </div>

    <script>
        document.getElementById("formCamion").addEventListener("submit", function (e) {
            e.preventDefault(); // Permanece en la página al guardar

            // 1. Guarda los datos en localStorage
            const nuevoCamion = {
                EstadoCam: document.getElementById("estado").value,
                Modelo: document.getElementById("modelo").value,
                C_CargaContenedor: document.getElementById("capacidad").value
            };

            let camionesLocales = JSON.parse(localStorage.getItem("camiones_agregados")) || [];
            nuevoCamion.Id_Camion = camionesLocales.length + 3;
            camionesLocales.push(nuevoCamion);
            
            localStorage.setItem("camiones_agregados", JSON.stringify(camionesLocales));

            // 2. Envía a PHP en segundo plano
            const formData = new FormData(this);
            fetch("registrocamiones.php", {
                method: "POST",
                body: formData
            }).catch(err => console.error(err));

            // 3. Limpia el formulario y muestra el mensaje de éxito por 3 segundos
            this.reset();
            const cartel = document.getElementById("mensajeExito");
            cartel.classList.remove("hidden");
            
            setTimeout(() => {
                cartel.classList.add("hidden");
            }, 3000);
        });
    </script>

</body>
</html>
