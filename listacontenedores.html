<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Contenedores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 sm:p-6 md:p-10">

<div class="max-w-6xl mx-auto">

    <div class="bg-white shadow-2xl rounded-2xl p-4 sm:p-8">

        <img src="image/contenedor.jpeg" class="mx-auto h-20 sm:h-28 mb-5 object-contain" alt="Contenedor">

        <h1 class="text-2xl sm:text-4xl font-bold text-center text-green-700 mb-6 sm:mb-8">
            Listado de Contenedores
        </h1>

        <div class="overflow-x-auto">
            <table class="min-w-full border border-gray-300 text-sm sm:text-base">
                <thead class="bg-green-700 text-white">
                    <tr>
                        <th class="px-4 py-3 border whitespace-nowrap">Estado</th>
                        <th class="px-4 py-3 border whitespace-nowrap">Capacidad</th>
                        <th class="px-4 py-3 border whitespace-nowrap">Tipo de residuo</th>
                        <th class="px-4 py-3 border whitespace-nowrap">Id de la ruta</th>
                    </tr>
                </thead>

                <tbody id="tablaCamiones" class="text-center bg-white divide-y divide-gray-200">
                    <!-- Los datos se cargan dinámicamente con JS -->
                </tbody>
            </table>
        </div>

    </div>

</div>

<script>
fetch("listarcontenedores.php")
.then(response => response.json())
.then(datos => {
    let tabla = document.getElementById("tablaCamiones");
    datos.forEach(camion => {
        tabla.innerHTML += `
        <tr class="hover:bg-green-50">
            <td class="border px-4 py-3">${camion.EstadoCam}</td>
            <td class="border px-4 py-3">${camion.C_CargaContenedor}</td>
            <td class="border px-4 py-3">${camion.Modelo}</td>
            <td class="border px-4 py-3">${camion.Id_Camion}</td>
        </tr>
        `;
    });
})
.catch(error => {
    console.log(error);
});
</script>

</body>
</html>
