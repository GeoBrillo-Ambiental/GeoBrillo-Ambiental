services:
  api-usuarios:
    build:
      context: ./api-usuarios
      dockerfile: Dockerfile
    container_name: geobrillo_api_usuarios
    ports:
      - "8081:80"
    volumes:
      - ./api-usuarios:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-geobrillo}
      DB_USER: ${DB_USER:-sigeru_user}
      DB_PASS: ${DB_PASS:-sigeru_password_123}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-gestion:
    build:
      context: ./api-gestion
      dockerfile: Dockerfile
    container_name: geobrillo_api_gestion
    ports:
      - "8082:80"
    volumes:
      - ./api-gestion:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-geobrillo}
      DB_USER: ${DB_USER:-sigeru_user}
      DB_PASS: ${DB_PASS:-sigeru_password_123}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-recoleccion:
    build:
      context: ./api-recoleccion
      dockerfile: Dockerfile
    container_name: geobrillo_api_recoleccion
    ports:
      - "8083:80"
    volumes:
      - ./api-recoleccion:/var/www/html
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-geobrillo}
      DB_USER: ${DB_USER:-sigeru_user}
      DB_PASS: ${DB_PASS:-sigeru_password_123}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:4
    container_name: geobrillo_adminer
    profiles: ["herramientas"]
    ports:
      - "8084:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geobrillo_frontend
    ports:
      - "8080:80"
    depends_on:
      - api-usuarios
      - api-gestion
      - api-recoleccion

